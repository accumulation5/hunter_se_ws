# 代价地图公共参数配置文件

# 机器人几何参数；如果机器人是圆形，设置 robot_radius；如果是其他形状设置 footprint
# robot_radius: 0.12 # 圆形
# 二维数组，四个顶点在代价地图中的坐标[x, y]，均为相对于机器人中心点；根据实际尺寸设置；依次为左下、左上、右上、右下
footprint: [[-0.325, -0.410], [-0.325, 0.410], [0.325, 0.410], [0.325, -0.410]] # 其他形状

obstacle_range: 4.0 # 用于障碍物探测，比如: 值为 3.0，意味着检测到距离小于 3 米的障碍物时，就会引入代价地图
raytrace_range: 5.0 # 用于清除障碍物，比如：值为 3.5，意味着清除代价地图中 3.5 米以外的障碍物

max_obstacle_height: 0.5 # 高于0.5米的障碍物会被忽略，防止检测到高出的无关物体

# 地图类型
map_type: costmap
# 导航包所需要的传感器
observation_sources: scan
# 对传感器的坐标系和数据进行配置。这个也会用于代价地图添加和清除障碍物。例如，你可以用激光雷达传感器用于在代价地图添加障碍物，再添加kinect用于导航和清除障碍物。
scan: {sensor_frame: lidar, data_type: LaserScan, topic: scan, marking: true, clearing: true}
