DWAPlannerROS:  # DWA局部路径规划器的参数配置

# Robot Configuration Parameters  # 机器人配置参数
  max_vel_x: 0.8    # X方向最大速度(米/秒)
  min_vel_x: 0.0    # X方向最小速度(米/秒)

  max_vel_y: 0.0    # Y方向最大速度(米/秒) - 非全向轮机器人设为0
  min_vel_y: 0.0    # Y方向最小速度(米/秒) - 非全向轮机器人设为0

  # The velocity when robot is moving in a straight line
  max_vel_trans: 0.8    # 机器人移动的最大平移速度(米/秒)
  min_vel_trans: 0.0   # 机器人移动的最小平移速度(米/秒)，负值表示可以后退

  max_vel_theta: 0.3    # 最大旋转速度(弧度/秒)
  min_vel_theta: -0.3  # 最小旋转速度(弧度/秒)

  acc_lim_x: 1.8       # X方向的加速度限制(米/秒²)
  acc_lim_y: 0.75       # Y方向的加速度限制(米/秒²)
  acc_lim_theta: 3      # 角加速度限制(弧度/秒²)

  # Goal Tolerance Parameters  # 目标容差参数
  xy_goal_tolerance: 0.13      # 到达目标点的xy平面距离误差容差(米)
  yaw_goal_tolerance: 0.40      # 到达目标点的偏航角误差容差(弧度)
  latch_xy_goal_tolerance: true    # 是否锁定目标点容差，如果为true，机器人到达目标点后将保持原位

# Forward Simulation Parameters  # 前向模拟参数
  sim_time: 1.5                # 前向模拟的时间长度(秒)
  sim_granularity: 0.025      # 轨迹模拟的步长(秒)
  vx_samples: 20               # X方向速度空间采样点数
  vy_samples: 0                # Y方向速度空间采样点数 - 非全向轮设为0
  vth_samples: 40              # 角速度空间采样点数
  controller_frequency: 10.0    # 控制器的执行频率(Hz)

# Trajectory Scoring Parameters  # 轨迹评分参数
  path_distance_bias: 60.0     # 路径距离权重，影响跟随参考路径的程度       原本是 50.0
  goal_distance_bias: 24.0      # 目标距离权重，影响朝向目标点移动的程度
  occdist_scale: 0.03           # 障碍物距离权重，影响避障行为的程度        原来为0.02
  
  forward_point_distance: 0.325    # 前向点距离，用于确定机器人朝向(米)
  stop_time_buffer: 0.3           # 停止时间缓冲，用于紧急制动(秒)
  scaling_speed: 0.25              # 速度缩放的参考速度(米/秒)
  max_scaling_factor: 0.2         # 最大速度缩放因子

  # Oscillation Prevention Parameters  # 振荡防止参数
  oscillation_reset_dist: 0.05     # 振荡重置距离，机器人移动该距离后重置振荡标记(米)

  # Debugging  # 调试参数
  publish_traj_pc: true           # 是否发布轨迹点云用于可视化
  publish_cost_grid_pc: true      # 是否发布代价地图点云用于可视化